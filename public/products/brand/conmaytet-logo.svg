<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Còn Mấy Cái Tết Nữa? — bao lì xì vàng và cành thông">
  <rect x="2" y="2" width="92" height="92" rx="24" fill="#1F4D3A"/>
  <!-- envelope body -->
  <path d="M28 48 h40 v26 a6 6 0 0 1 -6 6 H34 a6 6 0 0 1 -6 -6 Z" fill="#C9A227"/>
  <!-- envelope flap, open -->
  <path d="M28 48 L48 32 L68 48 L59 48 L48 39.5 L37 48 Z" fill="#E9D48A"/>
  <!-- pine stem -->
  <path d="M48 50 C48 42 47.5 36 51 27" fill="none" stroke="#FBF7EC" stroke-width="3.2" stroke-linecap="round"/>
  <!-- pine needles: two fans -->
  <g stroke="#FBF7EC" stroke-width="2.7" stroke-linecap="round">
    <path d="M51 27 L44.5 21"/><path d="M51 27 L49 19.5"/><path d="M51 27 L54 19.5"/><path d="M51 27 L58 22"/>
    <path d="M49.5 36 L43 31"/><path d="M49.5 36 L56.5 30.5"/>
  </g>
  <circle cx="51" cy="15.5" r="2.7" fill="#E9D48A"/>
</svg>