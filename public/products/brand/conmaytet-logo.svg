<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Còn Mấy Cái Tết Nữa? — hoa mai năm cánh">
  <!-- Nền đỏ sơn mài, bo góc -->
  <rect x="4" y="4" width="88" height="88" rx="22" fill="#8C1D18"/>
  <!-- Hoa mai năm cánh màu kem — biểu tượng của Tết phương Nam, nhìn là thấy Tết -->
  <circle cx="48" cy="29" r="11" fill="#F7E8D0"/>
  <circle cx="64" cy="41" r="11" fill="#F7E8D0"/>
  <circle cx="58" cy="60" r="11" fill="#F7E8D0"/>
  <circle cx="38" cy="60" r="11" fill="#F7E8D0"/>
  <circle cx="32" cy="41" r="11" fill="#F7E8D0"/>
  <!-- Nhuỵ hoa vàng đồng -->
  <circle cx="48" cy="46" r="6.5" fill="#D9A441"/>
</svg>
