<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Vòng năm mười hai tháng và cành hoa xuân">
  <!-- HERO «Vòng Năm» — BẢN ĐÃ SỬA theo V12-05 (lens-12) + lens-13 (ĐK-T1/T2/T3/T5/T8/T9) + DEBATE-LOG §4.
       ĐÃ BỎ so với bản lens-09 gốc: đĩa mặt trời gold ở tâm (motif stock) · đường đất ở đáy (motif stock) ·
       hoa fill đặc 5 vòng tròn. Motif DUY NHẤT còn lại suy từ VÒNG NĂM của mark:
       (1) Vòng 12 vạch tháng: vành r=128 tâm (500,180), nét mực 3. Vạch là vạch của đồng hồ-lịch:
           đều 30°, dài 14 vào trong, KHÔNG đường chia cung, KHÔNG glyph/số trong cung, KHÔNG vòng đệm,
           KHÔNG đĩa tâm (tâm vòng để TRỐNG) — ranh giới cứng lịch vs tử vi (VETO-V4-2 lens-13).
           Vạch tháng 1 dương lịch (góc −60°) phân biệt bằng ĐỘ DÀI TRƯỚC (22 vs 14), gold SAU (kênh hình phụ
           cho gold theo V-11.3 lens-11: gold trên sáng bị cấm ở vai chữ/icon/focus, được phép là trang trí
           có kênh hình phụ). TÊN ĐÃ SỬA theo ĐK-T9 lens-13: đây là "vạch tháng 1" DƯƠNG lịch —
           CẤM gọi là "Tháng Giêng" (tháng Giêng là tháng 1 ÂM lịch).
       (2) Cành hoa NÉT MỰC "không miền" (ĐK-T8): cánh = vòng outline mực, KHÔNG fill — cấm fill vàng (đọc thành
           mai/Nam) và cấm fill hồng/đỏ (đọc thành đào/Bắc); tâm hoa = chấm gold nhỏ.
           Ngân sách gold đếm theo NHÓM phần tử (ĐK-T5): nhóm 1 = vạch tháng 1 · nhóm 2 = tâm hoa. Tổng 2 nhóm.
           Kiểm "vòng hoa tang" (G-01): hoa nằm trên CÀNH NGOÀI vòng, không hoa nào bám vành vòng;
           tâm hoa gần nhất (286,138) cách tâm vòng 218đv — ngoài vành 90đv. ≥2/10 người nhắc vòng hoa tang = giết tổ hợp.
       Hình học giữ nguyên kể cả khi vòng 3 bác ngoại lệ art-class của bề mặt reveal (hero này sống trên tờ trắng). -->
