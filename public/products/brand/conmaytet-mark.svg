       khe trắng tối thiểu: đường-tâm kề đo ở V3 = 15,09đv → khe hiệu dụng = 15,09 − 6,5 = 8,59đv
       (giá trị 9,09đv của V3 ứng với nét 6đv; cổng quyết là render-check, xem render-check/).
