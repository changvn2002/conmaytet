name: CI

# Cổng chất lượng tự động cho mọi thay đổi (CQ-04 / OPS-01): cùng một
# dãy lệnh phải xanh ở máy dev (xem README mục "Bắt đầu nhanh") và trên
# CI. Job secret-scan (SEC-10) quét toàn bộ lịch sử git bằng gitleaks.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: typecheck / lint / format / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Dependency audit (SEC-10 — chặn khi có lỗ hổng)
        # Audit là cổng chặn thật (SEC-10/CQ-04): bước này KHÔNG có
        # cờ bỏ-qua-lỗi — `pnpm audit --prod` trả exit code khác 0
        # khi có advisory ở mức mặc định thì job fail ngay.
        run: pnpm audit --prod

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright, CQ-08)
        run: pnpm test:e2e

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action đọc danh sách commit của PR qua GitHub API nên job
    # cần quyền đọc pull request đi kèm token ở step dưới (theo mẫu sodam,
    # F-r3-5: thiếu GITHUB_TOKEN thì step quét pull_request tự fail).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
